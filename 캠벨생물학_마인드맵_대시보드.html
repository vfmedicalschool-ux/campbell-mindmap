<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠벨 생물학 12판 — 마인드맵 대시보드</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background: #080815;
  color: #e0e0e0;
  min-height: 100vh;
}

/* ── Top header ── */
.top-header {
  background: linear-gradient(135deg, #0d0d2b 0%, #12122e 60%, #0d1a2e 100%);
  padding: 36px 40px 28px;
  border-bottom: 1px solid #1e1e44;
  text-align: center;
}
.top-header .badge {
  display: inline-block;
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
  color: #6677cc; background: #14143a; border: 1px solid #2a2a5a;
  border-radius: 20px; padding: 4px 14px; margin-bottom: 16px;
  text-transform: uppercase;
}
.top-header h1 {
  font-size: 26px; font-weight: 900; color: #fff;
  letter-spacing: -0.01em; margin-bottom: 10px;
}
.top-header h1 span { color: #7c9ef5; }
.top-header p {
  font-size: 13px; color: #5566aa;
  max-width: 480px; margin: 0 auto;
  line-height: 1.6;
}

/* ── Stats bar ── */
.stats-bar {
  display: flex; justify-content: center; gap: 32px;
  padding: 18px 24px;
  background: #0c0c20;
  border-bottom: 1px solid #1a1a38;
}
.stat { text-align: center; }
.stat .val { font-size: 22px; font-weight: 900; color: #7c9ef5; }
.stat .lbl { font-size: 10px; color: #44446a; margin-top: 2px; letter-spacing: 0.06em; }

/* ── Main grid ── */
.main { padding: 32px 32px 48px; max-width: 1100px; margin: 0 auto; }
.section-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
  color: #44447a; text-transform: uppercase;
  margin-bottom: 20px; padding-bottom: 8px;
  border-bottom: 1px solid #1a1a38;
}

.chapters-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

/* ── Chapter card ── */
.chapter-card {
  background: #0e0e24;
  border: 1px solid #1e1e42;
  border-radius: 16px;
  overflow: hidden;
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  cursor: pointer;
  text-decoration: none;
  display: block;
  position: relative;
}
.chapter-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.chapter-card .card-top {
  padding: 22px 22px 16px;
  position: relative;
}
.chapter-card .ch-num {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; opacity: 0.85; margin-bottom: 8px;
}
.chapter-card .ch-title {
  font-size: 16px; font-weight: 800; color: #fff;
  line-height: 1.3; margin-bottom: 6px;
}
.chapter-card .ch-sub {
  font-size: 11px; color: #5566aa; line-height: 1.5;
}
.chapter-card .card-glow {
  position: absolute; top: 0; right: 0;
  width: 120px; height: 120px; border-radius: 0 16px 0 0;
  opacity: 0.07; pointer-events: none;
}

.chapter-card .concepts-list {
  padding: 0 22px 14px;
  display: flex; flex-direction: column; gap: 5px;
}
.concept-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 10.5px; color: #5577aa;
}
.concept-row .dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.concept-row .c-num { font-weight: 700; opacity: 0.8; min-width: 28px; }
.concept-row .c-txt { line-height: 1.3; }

.chapter-card .card-footer {
  padding: 12px 22px;
  border-top: 1px solid #181830;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px;
}
.card-footer .open-btn {
  display: flex; align-items: center; gap: 6px;
  font-weight: 700; color: #fff;
  opacity: 0.7; transition: opacity 0.15s;
}
.chapter-card:hover .open-btn { opacity: 1; }
.open-btn svg { width: 14px; height: 14px; }

.card-footer .fig-count {
  font-size: 10px; color: #33335a;
}

/* color theming via CSS var */
.chapter-card { --c: #7c9ef5; }
.chapter-card:hover { border-color: var(--c); }
.ch-num { color: var(--c); }

/* ── Legend strip ── */
.legend-strip {
  display: flex; gap: 20px; flex-wrap: wrap;
  justify-content: center;
  padding: 16px 24px;
  background: #0b0b1c;
  border-top: 1px solid #181830;
  font-size: 10.5px; color: #44446a;
}
.leg-item { display: flex; align-items: center; gap: 6px; }
.leg-dot {
  width: 10px; height: 10px; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
}
</style>
</head>
<body>

<div class="top-header">
  <div class="badge">Campbell Biology 12th Edition</div>
  <h1>📚 캠벨 생물학 12판<br><span>시험 대비 마인드맵</span></h1>
  <p>단원별 핵심 개념 마인드맵 · 백지 복습용 · 편입 시험 대비</p>
</div>

<div class="stats-bar">
  <div class="stat">
    <div class="val">3</div>
    <div class="lbl">단원</div>
  </div>
  <div class="stat">
    <div class="val">17</div>
    <div class="lbl">핵심 개념</div>
  </div>
  <div class="stat">
    <div class="val">41</div>
    <div class="lbl">교재 그림</div>
  </div>
  <div class="stat">
    <div class="val">★</div>
    <div class="lbl">고빈출 표시</div>
  </div>
  <div class="stat">
    <div class="val">📖</div>
    <div class="lbl">교재 그림 팝업</div>
  </div>
</div>

<div class="main">
  <div class="section-title">단원 선택</div>
  <div class="chapters-grid" id="grid"></div>
</div>

<div class="legend-strip">
  <div class="leg-item"><div class="leg-dot" style="background:#b45309">★</div>고빈출 필수</div>
  <div class="leg-item"><div class="leg-dot" style="background:#b91c1c">⚠</div>예외·주의</div>
  <div class="leg-item"><div class="leg-dot" style="background:#0e7490">↔</div>비교·구분</div>
  <div class="leg-item"><div class="leg-dot" style="background:#92400e">📖</div>교재 그림 참조</div>
  <div class="leg-item" style="margin-left:16px">노드 클릭 → 하위 접기/펼치기</div>
</div>

<script>
const CHAPTERS = [
  {
    file: '5장_생체거대분자_마인드맵_시험대비.html',
    num: 'Chapter 5',
    color: '#f59e0b',
    title: '생체 거대분자와 지질',
    sub: '단백질 · 핵산 · 탄수화물 · 지질',
    figures: 9,
    concepts: [
      { num:'5.1', text:'고분자의 합성과 분해' },
      { num:'5.2', text:'탄수화물 — 에너지와 구조' },
      { num:'5.3', text:'지질 — 다양한 소수성 분자' },
      { num:'5.4', text:'단백질 — 기능과 구조' },
      { num:'5.5', text:'핵산 — 정보 고분자' },
    ]
  },
  {
    file: '6장_에너지와생명체_마인드맵_시험대비.html',
    num: 'Chapter 6',
    color: '#22c55e',
    title: '에너지와 생명체',
    sub: '물질대사 · 자유에너지 · ATP · 효소',
    figures: 10,
    concepts: [
      { num:'6.1', text:'물질대사 — 이화작용과 동화작용' },
      { num:'6.2', text:'자유에너지와 반응 자발성' },
      { num:'6.3', text:'ATP — 세포 에너지 화폐' },
      { num:'6.4', text:'효소 — 활성화 에너지와 촉매' },
      { num:'6.5', text:'효소 활성의 조절' },
    ]
  },
  {
    file: '7장_세포구조기능_마인드맵_시험대비.html',
    num: 'Chapter 7',
    color: '#818cf8',
    title: '세포의 구조와 기능',
    sub: '원핵·진핵세포 · 핵/리보솜 · 내막계 · 미토콘드리아/엽록체 · 세포골격',
    figures: 22,
    concepts: [
      { num:'7.1', text:'세포 연구 방법 — 현미경과 세포분획법' },
      { num:'7.2', text:'원핵세포 vs 진핵세포 비교' },
      { num:'7.3', text:'핵과 리보솜 — 유전정보와 단백질 합성' },
      { num:'7.4', text:'내막계 — 소포체·골지체·리소좀' },
      { num:'7.5', text:'에너지 전환 소기관 — 미토콘드리아·엽록체·세포내공생설' },
      { num:'7.6', text:'세포골격 — 미세소관·미세섬유·운동단백질' },
      { num:'7.7', text:'세포 외부 구조 — 세포벽·ECM·세포간 연접' },
    ]
  }
];

const grid = document.getElementById('grid');

CHAPTERS.forEach(ch => {
  const card = document.createElement('a');
  card.className = 'chapter-card';
  card.href = ch.file;
  card.style.setProperty('--c', ch.color);

  const conceptRows = ch.concepts.map(c => `
    <div class="concept-row">
      <div class="dot" style="background:${ch.color};opacity:0.7"></div>
      <div class="c-num" style="color:${ch.color}">${c.num}</div>
      <div class="c-txt">${c.text}</div>
    </div>`).join('');

  const figText = ch.figures > 0
    ? `📖 교재 그림 ${ch.figures}개 포함`
    : '그림 추가 예정';

  card.innerHTML = `
    <div class="card-top">
      <div class="card-glow" style="background:radial-gradient(circle at 80% 20%, ${ch.color}, transparent)"></div>
      <div class="ch-num">${ch.num}</div>
      <div class="ch-title">${ch.title}</div>
      <div class="ch-sub">${ch.sub}</div>
    </div>
    <div class="concepts-list">${conceptRows}</div>
    <div class="card-footer">
      <div class="open-btn">
        마인드맵 열기
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 8h10M9 4l4 4-4 4"/>
        </svg>
      </div>
      <div class="fig-count">${figText}</div>
    </div>`;

  grid.appendChild(card);
});
</script>
</body>
</html>
